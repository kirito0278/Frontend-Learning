<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h1 class="matrix-text">Profile Cards UI:</h1>
        <div id="ui-cards">
            <div class="card dark">
                <div class="image">
                    <span>Things</span>
                </div>
                <div class="profile">
                    <div class="avatar">L</div>
                    <div>
                        <h3>Liam O'Connor</h3>
                        <p>Visual Artist</p>
                    </div>
                </div>
                <div class="info">
                    <span>⭐ 5.0<br><small>Rating</small></span>
                    <span>🚩 $99<br><small>Hour</small></span>
                    <span>◉ 12<br><small>Month</small></span>
                </div>
                <button>Get In Touch</button>
            </div>


            <div class="card light">
                <div class="image">
                    <span>Sketch</span>
                </div>
                <div class="profile">
                    <div class="avatar">A</div>
                    <div>
                        <h3>Alex Turner</h3>
                        <p>Creative Director</p>
                    </div>
                </div>
                <div class="info">
                    <span>⭐ 5.0<br><small>Rating</small></span>
                    <span>🚩 $150<br><small>Hour</small></span>
                    <span>◉ 24<br><small>Month</small></span>
                </div>
                    <button>Get In Touch</button>
            </div>
        </div>


    </div>

<div class="spot-light"></div>
    <script src="script.js"></script>
</body>
</html>
